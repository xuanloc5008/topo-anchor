# @package _global_

# Single NVIDIA L40/L40S-style 45-48GB CUDA preset for real training.
# Use with: +hardware=l40
data:
  batch_size: 2
  num_workers: 8
  patch_size: [192, 192, 32]
  loader:
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
    drop_last: true
  augmentation:
    spatial_prob: 0.3
    intensity_prob: 0.2

model:
  channels: [32, 64, 128, 256]
  topo_dim: 128
  app_dim: 64
  token_dim: 128
  attention_heads: 4
  mamba:
    backend: mamba_ssm
    d_state: 16
    d_conv: 4
    expand: 2

train:
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  log_every_n_steps: 20
  matmul_precision: high
  compile:
    enabled: false
    mode: default
  optimizer:
    lr: 1.0e-4
    weight_decay: 1.0e-5

trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 250
  num_sanity_val_steps: 2
